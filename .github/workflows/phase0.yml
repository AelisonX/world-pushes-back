name: Phase 0 Research Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  phase0:
    runs-on: ubuntu-latest

    env:
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate experiment manifest
        run: |
          python validate_manifest.py

      - name: Run physics regression tests
        run: |
          pytest -q

      - name: Run complete Phase 0 pipeline
        run: |
          python run_phase0.py

      - name: Audit rigid baseline anomaly
        run: |
          python rigid_anomaly_audit.py

      - name: Run Phase 0.5 classifier controls
        run: |
          python phase0_5_evaluate.py

      - name: Run Phase 0.5 Bayes convergence study
        run: |
          python phase0_5_bayes_convergence.py

      - name: Run Phase 0.5 Bayes ESS diagnostic
        run: |
          python phase0_5_bayes_ess.py

      - name: Run frozen Phase 0.5 confirmatory experiment
        run: |
          python run_phase0_5_confirmatory.py

      - name: Show generated files
        if: always()
        run: |
          echo "Generated research outputs:"
          find . -maxdepth 1 \
            \( -name "*.csv" -o -name "*.png" -o -name "*.json" \) \
            -print

      - name: Upload Phase 0 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-results
          path: |
            phase0_results.csv
            sensing_threshold_heatmap.png
            snr_collapse.png
          if-no-files-found: warn

      - name: Upload Phase 0.5 confirmatory results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-5-confirmatory-results
          path: |
            PHASE0_5_MANIFEST.json
            phase0_5_confirmatory_results.json
            phase0_5_confirmatory_records.csv
            phase0_5_operational_prior.json
          if-no-files-found: error