name: Phase 0 Research Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  phase0:
    runs-on: ubuntu-latest

    env:
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate experiment manifest
        run: |
          python validate_manifest.py

      - name: Run physics regression tests
        run: |
          pytest -q

      - name: Run complete Phase 0 pipeline
        run: |
          python run_phase0.py

      - name: Show generated files
        if: always()
        run: |
          echo "Generated research outputs:"
          find . -maxdepth 1 \
            \( -name "*.csv" -o -name "*.png" \) \
            -print

      - name: Upload Phase 0 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-results
          path: |
            phase0_results.csv
            sensing_threshold_heatmap.png
            snr_collapse.png
          if-no-files-found: warn